<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Pizza Calda</title>
</head>

<body>
    <header>
        <!-- DIV com Logo da Pizza Calda -->
        <div>
            <img src="imgs/LogoPizzaCalda.png" alt="Logo Pizza Calda">
        </div>

        <!-- DIV com os Botões -->
        <div id="botoes">
            <div>
                <a href="">Início</a>
            </div>
            <div>
                <a href="">Promoções</a>
            </div>
            <div>
                <a href="">Catálogo</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="SearchBar">
            <input type="search" name="" id="BarraDePesquisa" placeholder="Pesquisar...">
            <button type="submit" id="Enviar"></button>

        </div>

        <!-- Botão de Entrar -->
        <div id="enter">
            <a href="">Entrar</a>
        </div>
    </header>
    <main id="main1">
        <div id="inside-main">
            <h3>Pizza Calda</h3>
            <p>A melhor pizza da região</p>
            <div id="pedir-agora">
                <a href="">
                    Pedir Agora
                    <img src="imgs/Icon.png" alt="help a seta não aparece" class="icone">
                </a>
            </div>
        </div>
    </main>
</body>

</html>
