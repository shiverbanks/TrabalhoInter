<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Pizza Calda</title>
</head>

<body>
    <header>
        <!-- DIV com Logo da Pizza Calda -->
        <div>
            <img src="imgs/LogoPizzaCalda.png" alt="Logo Pizza Calda">
        </div>

        <!-- DIV com os Botões -->
        <div id="botoes">
            <div>
                <a href="" class="font-inter">Início</a>
            </div>
            <div>
                <a href="" class="font-inter">Promoções</a>
            </div>
            <div>
                <a href="" class="font-inter">Catálogo</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="SearchBar">
            <input type="search" name="" id="BarraDePesquisa" placeholder="Pesquisar..." class="font-inter">
            <button type="submit" id="Enviar"><img src="imgs/magnifying-glass.png" alt="" id="Lupa"></button>

        </div>

        <!-- Botão de Entrar -->
        <div id="enter">
            <a href="" class="font-inter" id="entrar">Entrar</a>
        </div>

        <!-- Login Box -->
        <div id="loginbox" class="loginbox">
            <form class="font-inter">
                <label for="mail">Usuário</label>
                <input name="mail" id="mail" type="email" placeholder="Seu nome de Usuário">

                <label for="pass">Senha</label>
                <input type="password" id="pass" name="pass" placeholder="Sua senha">

                <input type="submit" value="Entrar" id="submeter">

                <a href="">Esqueci minha senha</a>
                <a href=""><span>Não está registrado?</span> Crie uma conta</a>
            </form>
        </div>

    </header>
    <main id="main1">
        <div id="inside-main">
            <h3 class="font-geologica">Pizza Calda</h3>
            <p class="font-geologica">A melhor pizza da região</p>
            <div id="pedir-agora">
                <a href="" class="font-geologica">
                    Pedir Agora
                    <img src="imgs/arrow.png" alt="help a seta não aparece (Easter Egg)" class="icone">
                </a>
            </div>
        </div>
    </main>

    <a href="#CarrinhoDeCompras">
        <div id="carrinho"></div>
    </a>

    <section id="CarrinhoDeCompras">
        <div>
            <img src="imgs/" alt="">
        </div>

        
    </section>

    <script src="script.js"></script>
</body>

</html>
