<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Pizza Calda</title>
</head>

<body>
    <header>
        <!-- DIV com Logo da Pizza Calda -->
        <div>
            <img src="imgs/LogoPizzaCalda.png" alt="Logo Pizza Calda">
        </div>

        <!-- DIV com os Botões -->
        <div id="botoes_catalogo">
            <div>
                <a href="/index.html" class="font-inter">Início</a>
            </div>
            <div>
                <a href="#especiais_da_semana" class="font-inter">Promoções</a>
            </div>
            <div>
                <a href="" class="font-inter">Catálogo</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div id="SearchBar">
            <input type="search" name="" id="BarraDePesquisa" placeholder="Pesquisar..." class="font-inter">
            <button type="submit" id="Enviar"><img src="imgs/magnifying-glass.png" alt="" id="Lupa"></button>

        </div>

        <!-- Botão de Entrar -->
        <div id="enter">
            <a href="" class="font-inter" id="entrar">Entrar</a>
        </div>

        <!-- Login Box -->
        <div id="loginbox" class="loginbox">
            <form class="font-inter" id="loginForm">
        
                <label for="loginMail">Email</label>
                <input name="mail" id="loginMail" type="email" placeholder="Seu email" required>
        
                <label for="loginPass">Senha</label>
                <input type="password" id="loginPass" name="pass" placeholder="Sua senha" required>
        
                <input type="submit" value="Entrar" id="loginSubmit">
        
                <a href="">Esqueci minha senha</a>
        
                <a id="reg" href="">
                    <span>Não está registrado?</span> Crie uma conta
                </a>
        
            </form>
        </div>

        <!-- Register Box -->
        <div id="register" class="register">
            <form class="font-inter" id="registerForm">
                <label for="registerMail">Email</label>
                <input name="mail" id="registerMail" type="email" placeholder="Seu email" required>
        
                <label for="registerPass">Senha</label>
                <input type="password" id="registerPass" name="pass" placeholder="Sua senha" required>
        
                <label for="cpf">CPF</label>
                <input name="cpf" id="cpf" type="text" placeholder="Seu CPF" oninput="maskCpf()" required>
        
                <label for="tel">Telefone</label>
                <input name="tel" id="tel" type="tel" placeholder="Seu telefone" oninput="maskTel()" required >
         
                <label for="end">Endereço</label>
                <input name="end" id="end" type="text" placeholder="Seu endereço" required>
        
                <label for="cep">Cep</label>
                <input name="cep" id="cep" type="text" placeholder="Seu CEP" oninput="maskCep()" required>
        
                <input type="submit" value="Cadastrar" id="registerSubmit">
        
                <a id="login" href="">
                    <span>Já possui conta?</span> Logar
                </a>
            </form>
        </div>
        

    </header>

    <footer>
        <img src="imgs/LogoPizzaCalda.png" id="logo_footer">
        <p id="copyright" class="font-im-fell-dw-pica">© Copyright - 2026 - Pizza Calda</p>
    </footer>

    <dialog id="pepperoniTamanho" class="tamanho-dialog font-inter" data-id="6" data-nome="Pepperoni"
        data-imagem="imgs/PizzaPepperoni.png" aria-labelledby="pepperoniTitulo">
        <form>
            <h3 id="pepperoniTitulo">Escolha o tamanho</h3>
            <p class="tamanho-subtitulo">Pizza de Pepperoni</p>

            <fieldset>
                <legend class="sr-only">Tamanho da pizza</legend>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Pequena" data-preco="49.90" required>
                    <span class="opcao-nome">Pequena</span>
                    <span class="opcao-preco">R$ 49,90</span>
                </label>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Média" data-preco="64.90">
                    <span class="opcao-nome">Média</span>
                    <span class="opcao-preco">R$ 64,90</span>
                </label>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Grande" data-preco="79.90">
                    <span class="opcao-nome">Grande</span>
                    <span class="opcao-preco">R$ 79,90</span>
                </label>
            </fieldset>

            <div class="tamanho-acoes">
                <button type="button" class="tamanho-cancelar">Cancelar</button>
                <button type="submit" class="tamanho-confirmar">Adicionar ao Carrinho</button>
            </div>
        </form>
    </dialog>


    <dialog id="CarneTamanho" class="tamanho-dialog font-inter" data-id="7" data-nome="Carne"
        data-imagem="imgs/PizzaCarne.png" aria-labelledby="CarneTitulo">
        <form>
            <h3 id="CarneTitulo">Escolha o tamanho</h3>
            <p class="tamanho-subtitulo">Pizza de Pepperoni</p>

            <fieldset>
                <legend class="sr-only">Tamanho da pizza</legend>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Pequena" data-preco="49.90" required>
                    <span class="opcao-nome">Pequena</span>
                    <span class="opcao-preco">R$ 49,90</span>
                </label>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Média" data-preco="64.90">
                    <span class="opcao-nome">Média</span>
                    <span class="opcao-preco">R$ 64,90</span>
                </label>

                <label class="opcao-tamanho">
                    <input type="radio" name="tamanho" value="Grande" data-preco="79.90">
                    <span class="opcao-nome">Grande</span>
                    <span class="opcao-preco">R$ 79,90</span>
                </label>
            </fieldset>

            <div class="tamanho-acoes">
                <button type="button" class="tamanho-cancelar">Cancelar</button>
                <button type="submit" class="tamanho-confirmar">Adicionar ao Carrinho</button>
            </div>
        </form>
    </dialog>


    <a href="#CarrinhoDeCompras">
        <div id="carrinho"></div>
    </a>

    <section id="CarrinhoDeCompras">
        <a href="#nowhere"><img src="imgs/close.png" alt="Fechar" id="Fechar"></a>
        <p id="seila">Minha Sacola</p>
        <div id="carCom"></div>

        <div id="rodape">
            <div class="subtotal">
                <span>Subtotal:</span>
                <span id="total">R$0,00</span>
            </div>
            <button id="comprar">Comprar</button>
            <button id="limpar">Limpar Carrinho</button>
        </div>
    </section>


    </section>

    <script src="script.js"></script>
</body>

</html>
